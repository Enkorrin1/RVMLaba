<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Keeper</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <section class="hud">
      <div class="hud__title">
        <p class="hud__eyebrow">Prototype Build</p>
        <h1>Last Keeper</h1>
      </div>
      <div class="hud__card">
        <p id="objective" class="hud__objective">Цель: добраться до маяка и понять, почему он не работает.</p>
        <p id="hint" class="hud__hint">Управление: A/D или стрелки, Space для прыжка, E для взаимодействия.</p>
      </div>
    </section>

    <section class="game-shell">
      <canvas id="game" width="1280" height="720" aria-label="Игровая сцена Last Keeper"></canvas>
    </section>
  </main>

  <script src="./src/main.js"></script>
</body>
</html>
